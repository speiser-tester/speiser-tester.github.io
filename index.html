
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>NOAA Boston Tide Gauge Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js for water level time series -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>

  <style>

    /* ---------------------------------------
       1. PAGE LAYOUT
    --------------------------------------- */

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Initially the map fills the screen */
    #map {
      width: 100%;
      height: 100%;
      flex: 1 1 auto;
      min-height: 0;
    }

    /* When the chart is visible,
       the map occupies the upper portion */
    body.chart-open #map {
      flex: 0 0 55%;
    }

    /* ---------------------------------------
       2. STATION POPUP
    --------------------------------------- */

    .station-popup {
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    .station-popup h3 {
      margin: 0 0 8px;
      color: #174b70;
    }

    .station-popup a {
      color: #1264a3;
    }

    /* ---------------------------------------
       3. WATER LEVEL CHART PANEL
    --------------------------------------- */

    #chartPanel {
      display: none;
      height: 45%;
      flex: 0 0 45%;
      min-height: 0;
      background: #ffffff;
      border-top: 2px solid #cccccc;
      padding: 12px 20px 14px;
      flex-direction: column;
    }

    body.chart-open #chartPanel {
      display: flex;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 8px;
    }

    .chart-header h2 {
      margin: 0 0 4px;
      font-size: 19px;
      color: #174b70;
    }

    .chart-subtitle {
      font-size: 12px;
      color: #555555;
      line-height: 1.4;
    }

    #closeChart {
      border: none;
      background: #eeeeee;
      color: #333333;
      padding: 6px 11px;
      font-size: 18px;
      cursor: pointer;
      border-radius: 4px;
      flex-shrink: 0;
    }

    #closeChart:hover {
      background: #dddddd;
    }

    #chartStatus {
      font-size: 13px;
      color: #555555;
      margin-bottom: 5px;
    }

    .chart-container {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
    }

    #waterLevelChart {
      width: 100% !important;
      height: 100% !important;
    }

    /* Adapt the layout for smaller screens */
    @media (max-width: 600px) {

      body.chart-open #map {
        flex-basis: 45%;
      }

      #chartPanel {
        height: 55%;
        flex-basis: 55%;
        padding: 10px;
      }

      .chart-header h2 {
        font-size: 16px;
      }

      .chart-subtitle {
        font-size: 11px;
      }

    }

  </style>
</head>

<body>

  <!-- ---------------------------------------
       LEAFLET MAP
  ---------------------------------------- -->

  <div id="map"></div>

  <!-- ---------------------------------------
       WATER LEVEL CHART PANEL
       Initially hidden
  ---------------------------------------- -->

  <section id="chartPanel">

    <div class="chart-header">

      <div>
        <h2>Boston Harbor — Observed Water Levels</h2>

        <div class="chart-subtitle">
          NOAA Station 8443970 |
          Last 31 days |
          MLLW datum |
          Times in UTC
        </div>
      </div>

      <button
        id="closeChart"
        type="button"
        aria-label="Close water level chart"
      >
        &times;
      </button>

    </div>

    <div id="chartStatus">
      Loading observations...
    </div>

    <div class="chart-container">
      <canvas id="waterLevelChart"></canvas>
    </div>

  </section>


  <script>

    // =======================================
    // 1. NOAA BOSTON TIDE GAUGE
    // =======================================

    const stationID = "8443970";

    const stationLat = 42.35392;
    const stationLon = -71.05033;


    // =======================================
    // 2. INITIALIZE LEAFLET MAP
    // =======================================

    const map = L.map("map").setView(
      [stationLat, stationLon],
      14
    );


    // =======================================
    // 3. SATELLITE BASEMAP
    // =======================================

    const satellite = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Imagery &copy; Esri and contributors",
        maxZoom: 19
      }
    );

    satellite.addTo(map);


    // =======================================
    // 4. GEOGRAPHIC LABELS
    // =======================================

    const labels = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
      {
        attribution: "Labels &copy; Esri",
        maxZoom: 19,
        pane: "overlayPane"
      }
    );

    labels.addTo(map);


    // =======================================
    // 5. NOAA STATION MARKER
    // =======================================

    const marker = L.marker(
      [stationLat, stationLon]
    ).addTo(map);

    marker.bindPopup(`
      <div class="station-popup">

        <h3>NOAA Boston Tide Gauge</h3>

        <strong>Station:</strong> 8443970<br>
        <strong>Location:</strong> Boston Harbor, MA<br>
        <strong>Latitude:</strong> ${stationLat}<br>
        <strong>Longitude:</strong> ${stationLon}<br><br>

        <a
          href="https://tidesandcurrents.noaa.gov/stationhome.html?id=8443970"
          target="_blank"
          rel="noopener noreferrer"
        >
          View NOAA Station Data
        </a>

        <p>
          Click this marker to display the
          last 31 days of observed water levels.
        </p>

      </div>
    `);


    // =======================================
    // 6. MAP SCALE AND LAYERS
    // =======================================

    L.control.scale({
      imperial: true,
      metric: true
    }).addTo(map);

    L.control.layers(
      {
        "Satellite Imagery": satellite
      },
      {
        "Geographic Labels": labels
      },
      {
        collapsed: true
      }
    ).addTo(map);


    // =======================================
    // 7. CHART VARIABLES
    // =======================================

    const chartPanel =
      document.getElementById("chartPanel");

    const chartStatus =
      document.getElementById("chartStatus");

    const closeChartButton =
      document.getElementById("closeChart");

    const canvas =
      document.getElementById("waterLevelChart");

    let waterLevelChart = null;

    // Tracks whether a retrieval is in progress.
    let loading = false;


    // =======================================
    // 8. DATE FORMATTING
    // =======================================

    // Format a JavaScript Date as YYYYMMDD,
    // which is accepted by the NOAA API.

    function formatNOAADate(date) {

      const year = date.getUTCFullYear();

      const month = String(
        date.getUTCMonth() + 1
      ).padStart(2, "0");

      const day = String(
        date.getUTCDate()
      ).padStart(2, "0");

      return `${year}${month}${day}`;

    }


    // =======================================
    // 9. FETCH OBSERVED WATER LEVELS
    // =======================================

    // NOAA limits 6-minute water level
    // requests to approximately one month.
    //
    // We request two shorter periods,
    // then combine their observations.
    //
    // This retrieves 31 UTC calendar dates,
    // including the current UTC date.

    async function fetchWaterLevels() {

      const today = new Date();

      // Start of the current UTC day.
      const endDate = new Date(
        Date.UTC(
          today.getUTCFullYear(),
          today.getUTCMonth(),
          today.getUTCDate()
        )
      );

      // First date: 30 days before today.
      const startDate = new Date(endDate);

      startDate.setUTCDate(
        startDate.getUTCDate() - 30
      );

      // Split into two non-overlapping periods.
      const firstEnd = new Date(endDate);

      firstEnd.setUTCDate(
        firstEnd.getUTCDate() - 16
      );

      const secondStart = new Date(endDate);

      secondStart.setUTCDate(
        secondStart.getUTCDate() - 15
      );


      // Build a NOAA CO-OPS API URL.
      function buildURL(begin, end) {

        const params = new URLSearchParams({

          product: "water_level",

          application: "BostonTideGaugeMap",

          begin_date: formatNOAADate(begin),

          end_date: formatNOAADate(end),

          datum: "MLLW",

          station: stationID,

          time_zone: "gmt",

          units: "metric",

          format: "json"

        });

        return (
          "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?" +
          params.toString()
        );

      }


      // Retrieve one period from NOAA.
      async function getPeriod(begin, end) {

        const url = buildURL(begin, end);

        const response = await fetch(url);

        if (!response.ok) {
          throw new Error(
            `NOAA request failed: HTTP ${response.status}`
          );
        }

        const result = await response.json();

        // NOAA sometimes reports errors inside
        // a successful HTTP response.
        if (result.error) {

          throw new Error(
            result.error.message ||
            "NOAA returned an API error."
          );

        }

        if (!Array.isArray(result.data)) {

          throw new Error(
            "NOAA returned no water level data."
          );

        }

        return result.data;

      }


      // Fetch both periods simultaneously.
      const results = await Promise.all([

        getPeriod(startDate, firstEnd),

        getPeriod(secondStart, endDate)

      ]);


      // Combine observations.
      const observations = [
        ...results[0],
        ...results[1]
      ];


      // Convert NOAA responses into chart data.
      //
      // NOAA returns timestamps formatted as:
      // YYYY-MM-DD HH:mm
      //
      // These are GMT/UTC because time_zone=gmt.

      const parsed = observations
        .map(record => {

          const value = Number(record.v);

          const timestamp = Date.parse(
            record.t.replace(" ", "T") + "Z"
          );

          return {
            x: timestamp,
            y: value
          };

        })
        .filter(record =>
          Number.isFinite(record.x) &&
          Number.isFinite(record.y)
        );


      // Sort chronologically.
      parsed.sort((a, b) => a.x - b.x);


      // Remove duplicate timestamps if present.
      const unique = parsed.filter(
        (record, index, array) =>
          index === 0 ||
          record.x !== array[index - 1].x
      );


      return unique;

    }


    // =======================================
    // 10. DRAW TIME SERIES CHART
    // =======================================

    function drawWaterLevelChart(data) {

      // Destroy the previous chart if present.
      if (waterLevelChart !== null) {

        waterLevelChart.destroy();

        waterLevelChart = null;

      }


      // Convert timestamps into readable labels.
      const dateLabels = data.map(point => {

        return new Date(point.x).toLocaleString(
          "en-US",
          {
            timeZone: "UTC",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
          }
        );

      });


      // Use nulls to show gaps between observations
      // rather than connecting across missing data.
      const values = [];
      const labelsWithGaps = [];

      for (let i = 0; i < data.length; i++) {

        if (i > 0) {

          const gapMinutes =
            (data[i].x - data[i - 1].x) / 60000;

          if (gapMinutes > 12) {

            labelsWithGaps.push("");
            values.push(null);

          }

        }

        labelsWithGaps.push(dateLabels[i]);
        values.push(data[i].y);

      }


      // Create the Chart.js line graph.
      waterLevelChart = new Chart(
        canvas,
        {

          type: "line",

          data: {

            labels: labelsWithGaps,

            datasets: [
              {

                label: "Observed Water Level",

                data: values,

                borderColor: "#1769aa",

                backgroundColor: "rgba(23,105,170,0.12)",

                borderWidth: 1.5,

                pointRadius: 0,

                pointHoverRadius: 4,

                pointHitRadius: 8,

                fill: false,

                tension: 0,

                spanGaps: false

              }
            ]

          },

          options: {

            responsive: true,

            maintainAspectRatio: false,

            animation: false,

            normalized: true,

            interaction: {

              mode: "nearest",

              intersect: false

            },

            plugins: {

              legend: {
                display: false
              },

              tooltip: {

                callbacks: {

                  title: function(items) {

                    if (!items.length) return "";

                    const index = items[0].dataIndex;

                    // Find the actual timestamp
                    // corresponding to the label.
                    return labelsWithGaps[index] +
                      " UTC";

                  },

                  label: function(context) {

                    return (
                      "Water level: " +
                      context.parsed.y.toFixed(3) +
                      " m MLLW"
                    );

                  }

                }

              }

            },

            scales: {

              x: {

                title: {
                  display: true,
                  text: "Date and Time (UTC)"
                },

                ticks: {

                  maxTicksLimit: 9,

                  maxRotation: 0,

                  autoSkip: true

                },

                grid: {
                  display: false
                }

              },

              y: {

                title: {
                  display: true,
                  text: "Water Level (m, MLLW)"
                },

                ticks: {

                  callback: function(value) {
                    return value.toFixed(1);
                  }

                }

              }

            }

          }

        }
      );

    }


    // =======================================
    // 11. OPEN CHART AND LOAD NOAA DATA
    // =======================================

    async function showWaterLevels() {

      // Reveal the chart panel.
      document.body.classList.add("chart-open");

      // Leaflet needs to recalculate its size
      // because the map container became smaller.
      setTimeout(() => {
        map.invalidateSize();
      }, 100);


      // Prevent duplicate simultaneous requests.
      if (loading) {
        return;
      }

      loading = true;

      chartStatus.textContent =
        "Loading 31 days of observed water levels from NOAA...";


      try {

        const data = await fetchWaterLevels();

        if (data.length === 0) {

          throw new Error(
            "No valid observations were returned."
          );

        }

        drawWaterLevelChart(data);

        const first = new Date(data[0].x);
        const last = new Date(
          data[data.length - 1].x
        );

        const formatTime = date =>
          date.toLocaleString(
            "en-US",
            {
              timeZone: "UTC",
              month: "short",
              day: "numeric",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit"
            }
          );

        chartStatus.textContent =
          `${data.length.toLocaleString()} observations | ` +
          `${formatTime(first)} to ${formatTime(last)} UTC`;

      }

      catch (error) {

        console.error(
          "NOAA water level retrieval error:",
          error
        );

        chartStatus.textContent =
          "Unable to load NOAA observations: " +
          error.message;

      }

      finally {

        loading = false;

      }

    }


    // =======================================
    // 12. MARKER CLICK EVENT
    // =======================================

    // Clicking the NOAA marker opens its popup
    // and loads the water level time series.

    marker.on("click", function() {

      showWaterLevels();

    });


    // =======================================
    // 13. CLOSE CHART PANEL
    // =======================================

    closeChartButton.addEventListener(
      "click",
      function() {

        document.body.classList.remove(
          "chart-open"
        );

        // Resize the Leaflet map after
        // restoring its full-screen layout.
        setTimeout(() => {
          map.invalidateSize();
        }, 100);

      }
    );

  </script>

</body>
</html>
