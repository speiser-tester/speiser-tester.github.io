
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NOAA Boston Tide Gauge Map</title>

  <!-- Load Leaflet CSS from a CDN (no security hashes) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    /* Remove default browser margins and fill the screen */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    /* Make the map fill the entire browser window */
    #map {
      height: 100vh;
      width: 100%;
    }

    /* Style the station popup */
    .station-popup {
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    .station-popup h3 {
      margin: 0 0 8px;
      color: #174b70;
    }
  </style>
</head>

<body>

  <!-- The container in which Leaflet draws the map -->
  <div id="map"></div>

  <!-- Load the Leaflet JavaScript library -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // -------------------------------------------
    // 1. NOAA BOSTON TIDE GAUGE LOCATION
    // -------------------------------------------

    // NOAA station 8443970, Boston Harbor
    const stationLat = 42.35392;
    const stationLon = -71.05033;

    // -------------------------------------------
    // 2. INITIALIZE THE LEAFLET MAP
    // -------------------------------------------

    // Center the map at the tide gauge.
    // Zoom 14 shows the surrounding waterfront.
    const map = L.map('map').setView(
      [stationLat, stationLon],
      14
    );

    // -------------------------------------------
    // 3. SATELLITE IMAGERY BASEMAP
    // -------------------------------------------

    // Esri World Imagery provides satellite imagery.
    const satellite = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Imagery &copy; Esri and contributors',
        maxZoom: 19
      }
    );

    // Add satellite imagery to the map.
    satellite.addTo(map);

    // -------------------------------------------
    // 4. GEOGRAPHIC LABELS OVER SATELLITE
    // -------------------------------------------

    // This transparent layer adds place names,
    // road names, and geographic labels.
    const labels = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Labels &copy; Esri',
        maxZoom: 19,
        pane: 'overlayPane'
      }
    );

    // Draw the labels above the imagery.
    labels.addTo(map);

    // -------------------------------------------
    // 5. ADD NOAA TIDE GAUGE MARKER
    // -------------------------------------------

    // Create a marker at the NOAA station location.
    const marker = L.marker(
      [stationLat, stationLon]
    ).addTo(map);

    // Add a popup with station information.
    marker.bindPopup(`
      <div class="station-popup">
        <h3>NOAA Boston Tide Gauge</h3>
        <strong>Station:</strong> 8443970<br>
        <strong>Location:</strong> Boston Harbor, MA<br>
        <strong>Latitude:</strong> ${stationLat}<br>
        <strong>Longitude:</strong> ${stationLon}<br><br>

        <a
          href="https://tidesandcurrents.noaa.gov/stationhome.html?id=8443970"
          target="_blank"
          rel="noopener noreferrer"
        >
          View NOAA Station Data
        </a>
      </div>
    `);

    // Open the popup automatically when map loads.
    marker.openPopup();

    // -------------------------------------------
    // 6. MAP SCALE
    // -------------------------------------------

    // Display a distance scale in miles and km.
    L.control.scale({
      imperial: true,
      metric: true
    }).addTo(map);

    // -------------------------------------------
    // 7. OPTIONAL MAP LAYER CONTROL
    // -------------------------------------------

    // Allow users to toggle geographic labels.
    L.control.layers(
      {
        "Satellite Imagery": satellite
      },
      {
        "Geographic Labels": labels
      },
      {
        collapsed: true
      }
    ).addTo(map);

  </script>

</body>
</html>
